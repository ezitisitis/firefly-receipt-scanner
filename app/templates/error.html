{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<div class="card card-danger card-outline mb-4">
    <div class="card-header">
        <h3 class="card-title"><i class="bi bi-exclamation-triangle me-1"></i> Something went wrong</h3>
    </div>
    <div class="card-body">
        <div class="alert alert-danger mb-0" role="alert">{{ error_message }}</div>
    </div>
    <div class="card-footer">
        <a href="/" class="btn btn-primary w-100"><i class="bi bi-arrow-left"></i> Return to upload</a>
    </div>
</div>
{% endblock %}
