<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}Receipt Scanner{% endblock %} » Receipt Scanner</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <script>
            // Follow the OS light/dark preference, like Firefly III v2.
            (() => {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                const apply = () => document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
                apply();
                mq.addEventListener('change', apply);
            })();
        </script>
        <!-- iOS specific -->
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="apple-mobile-web-app-title" content="Receipt Scanner">
        <!-- Android specific -->
        <meta name="theme-color" content="#1e6581">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="application-name" content="Receipt Scanner">
        <!-- Icons -->
        <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='images/favicon_32x32.png') }}">
        <!-- Apple Touch Icons -->
        <link rel="apple-touch-icon" sizes="144x144" href="{{ url_for('static', path='images/favicon_144x144.png') }}">
        <link rel="manifest" href="{{ url_for('static', path='manifest.json') }}">
        <!-- Source Sans 3, Bootstrap Icons, AdminLTE 4 (bundles Bootstrap 5.3 CSS) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css" integrity="sha384-g8Ghv3t8mtnVyQ++/+3xr5ZCA7QFf/qX8qpW+pwIVTqNiMqruf5kT95EMlXwYP95" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/css/adminlte.min.css" integrity="sha384-UqRR9PaoK16nbf42Sqcd4FbL2CkbpbZuBJK7HfJZBUhZINJzdCZG/6lFkXWJZoB/" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
        {% block extra_head %}{% endblock %}
    </head>
    <body class="layout-fixed bg-body-tertiary">
        <div class="app-wrapper">
            <nav class="app-header navbar navbar-expand bg-body">
                <div class="container-fluid">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                        <img src="{{ url_for('static', path='images/favicon_32x32.png') }}" alt="" width="32" height="32" class="rounded shadow-sm">
                        <span class="fw-light">Receipt Scanner</span>
                    </a>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ firefly_url }}" title="Open Firefly III">
                                <i class="bi bi-box-arrow-up-right"></i>
                                <span class="d-none d-sm-inline ms-1">Firefly III</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            <main class="app-main">
                <div class="container-fluid">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-8 col-lg-6 col-xxl-5">
                            <div class="app-content-header px-0">
                                <h3 class="mb-0">{{ self.title() }}</h3>
                            </div>
                            <div class="app-content px-0">
                                {% block content %}{% endblock %}
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/js/adminlte.min.js" integrity="sha384-4ah0JNKzuIoSs74l3UZo0AC1jFbROkz6/LiwEuWtTBIHy53qLxRCg5ePPP05KLq1" crossorigin="anonymous"></script>
        {% block extra_scripts %}{% endblock %}
    </body>
</html>
